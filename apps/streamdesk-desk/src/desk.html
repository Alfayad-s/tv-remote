<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StreamDesk — Mac desk</title>
    <style>
      :root {
        --ink: #111;
        --paper: #f3efe4;
        --yellow: #f5e400;
        --coral: #ff5a36;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
        background: var(--paper);
        color: var(--ink);
      }
      header {
        background: var(--ink);
        color: var(--paper);
        padding: 1.25rem 1.5rem;
        border-bottom: 5px solid var(--ink);
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 1rem;
        align-items: end;
      }
      header p { margin: 0; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.7; }
      header h1 { margin: 0.35rem 0 0; font-size: 1.75rem; text-transform: uppercase; }
      header .pin { margin-top: 0.75rem; font-family: ui-monospace, monospace; font-size: 1.1rem; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; padding: 1.25rem; max-width: 1100px; margin: 0 auto; }
      @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
      section {
        border: 4px solid var(--ink);
        background: var(--paper);
        box-shadow: 5px 5px 0 #111;
        padding: 1rem;
        min-height: 20rem;
      }
      h2 { margin: 0; text-transform: uppercase; font-size: 1.15rem; }
      .hint { margin: 0.5rem 0 1rem; font-size: 0.9rem; opacity: 0.75; }
      .count { font-family: ui-monospace, monospace; font-size: 11px; text-transform: uppercase; }
      input[type="search"] {
        width: 100%;
        border: 3px solid var(--ink);
        padding: 0.6rem 0.75rem;
        font: inherit;
        margin-bottom: 0.75rem;
        background: white;
      }
      ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; max-height: 28rem; overflow: auto; }
      li {
        display: flex; align-items: center; gap: 0.75rem;
        border: 3px solid var(--ink); padding: 0.5rem 0.65rem; background: white;
      }
      #desk li { cursor: grab; }
      li.dragging { opacity: 0.5; }
      li img, .icon-fallback {
        width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex-shrink: 0;
        border: 2px solid var(--ink); background: #ddd;
      }
      .icon-fallback { display: grid; place-items: center; font-weight: 700; }
      .meta { flex: 1; min-width: 0; }
      .meta strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .meta span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.6; }
      button {
        border: 3px solid var(--ink); background: var(--yellow); font-weight: 700;
        text-transform: uppercase; padding: 0.45rem 0.65rem; cursor: pointer;
        box-shadow: 3px 3px 0 #111;
      }
      button.danger { background: var(--coral); }
      button:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #111; }
      .empty { border: 3px dashed var(--ink); padding: 1rem; font-size: 0.95rem; }
      .toast {
        position: fixed; bottom: 1rem; right: 1rem; background: var(--ink); color: var(--paper);
        padding: 0.75rem 1rem; border: 3px solid var(--yellow); display: none; z-index: 20;
      }
      .toast.show { display: block; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <p>StreamDesk desk</p>
        <h1>Arrange phone apps</h1>
        <div class="pin">Pairing PIN: <strong id="pin">······</strong></div>
      </div>
      <button type="button" id="reload">Reload apps</button>
    </header>
    <main>
      <section>
        <h2>On phone <span class="count" id="desk-count"></span></h2>
        <p class="hint">Drag to reorder. This list is what the mobile remote shows.</p>
        <ul id="desk"></ul>
        <p class="empty" id="desk-empty" hidden>No apps on the phone desk yet. Add some from the right.</p>
      </section>
      <section>
        <h2>Mac apps <span class="count" id="catalog-count"></span></h2>
        <p class="hint">Installed apps from Applications. Search, then tap Add.</p>
        <input id="search" type="search" placeholder="Search apps…" />
        <p class="empty" id="catalog-status">Loading Mac apps…</p>
        <ul id="catalog"></ul>
      </section>
    </main>
    <div class="toast" id="toast"></div>
    <script>
      const deskEl = document.getElementById("desk");
      const catalogEl = document.getElementById("catalog");
      const searchEl = document.getElementById("search");
      const pinEl = document.getElementById("pin");
      const toastEl = document.getElementById("toast");
      const deskEmpty = document.getElementById("desk-empty");
      const catalogStatus = document.getElementById("catalog-status");
      const deskCount = document.getElementById("desk-count");
      const catalogCount = document.getElementById("catalog-count");

      let catalog = [];
      let deskIds = [];
      let dragFrom = null;

      function toast(message) {
        toastEl.textContent = message;
        toastEl.classList.add("show");
        clearTimeout(toast._t);
        toast._t = setTimeout(() => toastEl.classList.remove("show"), 2200);
      }

      function iconNode(app) {
        if (app.iconUrl) {
          const img = document.createElement("img");
          img.src = app.iconUrl;
          img.alt = "";
          img.width = 40;
          img.height = 40;
          img.onerror = () => {
            const fallback = document.createElement("div");
            fallback.className = "icon-fallback";
            fallback.textContent = (app.name || "?").slice(0, 1).toUpperCase();
            img.replaceWith(fallback);
          };
          return img;
        }
        const fallback = document.createElement("div");
        fallback.className = "icon-fallback";
        fallback.textContent = (app.name || "?").slice(0, 1).toUpperCase();
        return fallback;
      }

      function row(app, options) {
        const li = document.createElement("li");
        li.dataset.id = app.id;
        if (options.index !== undefined) {
          li.dataset.index = String(options.index);
          li.draggable = true;
        }
        li.appendChild(iconNode(app));
        const meta = document.createElement("div");
        meta.className = "meta";
        const strong = document.createElement("strong");
        strong.textContent = app.name;
        const span = document.createElement("span");
        span.textContent = options.subtitle;
        meta.append(strong, span);
        li.appendChild(meta);
        const actions = document.createElement("div");
        actions.className = "actions";
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = options.actionLabel;
        if (options.danger) button.className = "danger";
        button.dataset[options.action] = app.id;
        actions.appendChild(button);
        li.appendChild(actions);
        return li;
      }

      function renderDesk() {
        const byId = new Map(catalog.map((app) => [app.id, app]));
        deskEl.replaceChildren();
        deskIds.forEach((id, index) => {
          const app = byId.get(id) || { id, name: id, running: false, iconUrl: null };
          deskEl.appendChild(
            row(app, {
              index,
              subtitle: app.running ? "Running" : "Not running",
              action: "remove",
              actionLabel: "Remove",
              danger: true,
            }),
          );
        });
        deskEmpty.hidden = deskIds.length > 0;
        deskCount.textContent = `(${deskIds.length})`;
      }

      function renderCatalog() {
        const q = searchEl.value.trim().toLowerCase();
        const onDesk = new Set(deskIds);
        const rows = catalog.filter(
          (app) => !onDesk.has(app.id) && (!q || app.name.toLowerCase().includes(q)),
        );
        catalogEl.replaceChildren();
        rows.slice(0, 120).forEach((app) => {
          catalogEl.appendChild(
            row(app, {
              subtitle: app.running ? "Running" : "Installed",
              action: "add",
              actionLabel: "Add",
            }),
          );
        });
        catalogCount.textContent = `(${rows.length} shown / ${catalog.length} total)`;
        if (catalog.length === 0) {
          catalogStatus.hidden = false;
          catalogStatus.textContent = "No Mac apps loaded. Tap Reload apps.";
        } else if (rows.length === 0) {
          catalogStatus.hidden = false;
          catalogStatus.textContent = q
            ? "No matches for that search."
            : "Every listed app is already on the phone desk.";
        } else {
          catalogStatus.hidden = true;
        }
      }

      async function saveLayout() {
        renderDesk();
        renderCatalog();
        try {
          const res = await fetch("/api/layout", {
            method: "PUT",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ appIds: deskIds }),
          });
          if (!res.ok) {
            toast("Could not save layout");
            return;
          }
          const data = await res.json();
          catalog = Array.isArray(data.apps) ? data.apps : catalog;
          deskIds = Array.isArray(data.desk) ? data.desk.map((app) => app.id) : deskIds;
          renderDesk();
          renderCatalog();
          toast("Saved — phone will update");
        } catch (error) {
          toast("Save failed — restart npm run streamdesk:dev");
          console.error(error);
        }
      }

      async function load() {
        catalogStatus.hidden = false;
        catalogStatus.textContent = "Loading Mac apps…";
        try {
          const status = await fetch("/api/status").then((r) => r.json());
          pinEl.textContent = status.pin || "······";
        } catch {
          pinEl.textContent = "offline";
        }

        try {
          const layout = await fetch("/api/layout").then((r) => r.json());
          deskIds = Array.isArray(layout.appIds) ? layout.appIds : [];
        } catch {
          deskIds = [];
        }
        renderDesk();

        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 8000);
          const apps = await fetch("/api/apps", { signal: controller.signal }).then((r) => r.json());
          clearTimeout(timer);
          catalog = Array.isArray(apps.apps) ? apps.apps : [];
          if (Array.isArray(apps.desk) && apps.desk.length) {
            deskIds = apps.desk.map((app) => app.id);
          }
          renderDesk();
          renderCatalog();
          toast(`Loaded ${catalog.length} Mac apps`);
        } catch (error) {
          catalog = [];
          renderCatalog();
          catalogStatus.hidden = false;
          catalogStatus.textContent =
            "Could not load Mac apps. Stop other desk processes and run npm run streamdesk:dev again.";
          console.error(error);
        }
      }

      deskEl.addEventListener("click", (event) => {
        const btn = event.target.closest("[data-remove]");
        if (!btn) return;
        event.preventDefault();
        deskIds = deskIds.filter((id) => id !== btn.getAttribute("data-remove"));
        void saveLayout();
      });

      catalogEl.addEventListener("click", (event) => {
        const btn = event.target.closest("[data-add]");
        if (!btn) return;
        event.preventDefault();
        event.stopPropagation();
        const id = btn.getAttribute("data-add");
        if (id && !deskIds.includes(id)) {
          deskIds = [...deskIds, id];
          void saveLayout();
        }
      });

      searchEl.addEventListener("input", renderCatalog);
      document.getElementById("reload").addEventListener("click", () => void load());

      deskEl.addEventListener("dragstart", (event) => {
        const li = event.target.closest("li");
        if (!li) return;
        dragFrom = Number(li.dataset.index);
        li.classList.add("dragging");
        event.dataTransfer.effectAllowed = "move";
      });
      deskEl.addEventListener("dragend", (event) => {
        event.target.closest("li")?.classList.remove("dragging");
        dragFrom = null;
      });
      deskEl.addEventListener("dragover", (event) => {
        event.preventDefault();
        const li = event.target.closest("li");
        if (!li || dragFrom === null) return;
        const to = Number(li.dataset.index);
        if (Number.isNaN(to) || to === dragFrom) return;
        const next = [...deskIds];
        const [item] = next.splice(dragFrom, 1);
        next.splice(to, 0, item);
        deskIds = next;
        dragFrom = to;
        renderDesk();
      });
      deskEl.addEventListener("drop", (event) => {
        event.preventDefault();
        void saveLayout();
      });

      void load();
      setInterval(() => {
        void fetch("/api/status")
          .then((r) => r.json())
          .then((status) => {
            pinEl.textContent = status.pin || pinEl.textContent;
          })
          .catch(() => {});
      }, 5000);
    </script>
  </body>
</html>
